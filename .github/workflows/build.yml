# Builds the SDK (VLC for wasm + our bridge and modules) in both variants,
# tests it in headless browsers and packages it. Tags (v*) also publish a
# GitHub release, and to npm from the `npm` environment (trusted publishing,
# or an NPM_TOKEN secret there). Run it by hand to build against another VLC
# commit.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      vlc_commit:
        description: VLC commit to build (empty = the one pinned in build.sh)
        required: false
      profile:
        description: release or debug
        default: release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  wasm:
    name: wasm (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # default: the player. sout: + VLC's stream output (transcode, remux, record).
        variant: [default, sout]
    env:
      CACHE_DIR: ${{ github.workspace }}/.vlc-cache
      PROFILE: ${{ inputs.profile || 'release' }}
      VARIANT: ${{ matrix.variant }}
    outputs:
      vlc_commit: ${{ steps.vlc.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The input arrives through env, never spliced into the script, and has
      # to be a full commit hash before it goes anywhere near a shell.
      - name: Resolve the VLC commit
        id: vlc
        env:
          INPUT_VLC_COMMIT: ${{ inputs.vlc_commit }}
        run: |
          pinned=$(sed -n 's/^VLC_COMMIT=\${VLC_COMMIT:-\([0-9a-f]*\)}.*/\1/p' build.sh)
          commit=${INPUT_VLC_COMMIT:-$pinned}
          if ! printf '%s' "$commit" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::vlc_commit must be a full 40-character lowercase commit hash"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # Contribs (FFmpeg, dav1d, libass, ...) are the slow part: about an hour
      # on a hosted runner. Keyed on everything that can change them.
      - name: Restore the VLC build tree
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vlc-cache
          key: vlc-${{ matrix.variant }}-${{ steps.vlc.outputs.commit }}-${{ env.PROFILE }}-${{ hashFiles('build/Dockerfile', 'build/build-vlc.sh', 'build/patches/*') }}
          restore-keys: vlc-${{ matrix.variant }}-${{ steps.vlc.outputs.commit }}-${{ env.PROFILE }}-

      - name: Build VLC for wasm and link
        env:
          VLC_COMMIT: ${{ steps.vlc.outputs.commit }}
          JOBS: 4
        run: |
          mkdir -p "$CACHE_DIR"
          ./build.sh all
          out=packages/core/wasm; [ "$VARIANT" = sout ] && out=packages/sout/wasm
          sudo chown -R "$(id -u):$(id -g)" .vlc-cache "$out"
          ls -la "$out"
          echo "WASM_OUT=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-${{ matrix.variant }}
          path: ${{ env.WASM_OUT }}/
          if-no-files-found: error

  test:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: wasm-default, path: packages/core/wasm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: wasm-sout, path: packages/sout/wasm }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg dvdauthor genisoimage imagemagick curl unzip
          sh tests/make-fixtures.sh
          sh tests/make-dvd.sh
          sh tests/make-bluray.sh
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Node smoke test (probe + thumbnail)
        run: node tests/node-smoke.mjs
      - name: Feature suite in three engines
        run: |
          node tests/features.mjs --engine=chromium
          node tests/features.mjs --engine=firefox
          node tests/features.mjs --engine=webkit
      - name: Stream output (transcode, remux, record) in three engines
        run: |
          node corpus/fetch.mjs realvideo-4-cook-rmvb
          node tests/sout.mjs --engine=chromium
          node tests/sout.mjs --engine=firefox
          node tests/sout.mjs --engine=webkit
      - name: Obscure-format corpus
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          node corpus/fetch.mjs
          node tests/verify-corpus.mjs --engines=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: corpus/results/
          if-no-files-found: ignore

  package:
    needs: [wasm, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: wasm-default, path: packages/core/wasm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: wasm-sout, path: packages/sout/wasm }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Pack
        env:
          VLC_COMMIT: ${{ needs.wasm.outputs.vlc_commit }}
        run: |
          printf '%s' "$VLC_COMMIT" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::bad VLC commit '$VLC_COMMIT'"; exit 1; }
          for p in core sout; do
            echo "$VLC_COMMIT" > packages/$p/wasm/VLC_COMMIT
            (cd packages/$p && pnpm pack)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: packages/*/*.tgz
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: packages/*/*.tgz
          body: Built from VLC ${{ needs.wasm.outputs.vlc_commit }}.

  # Its own job so the npm credentials live in one environment (which can
  # require approval) and nothing else in the workflow can reach them.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm provenance and trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: npm-package, path: packages }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Trusted publishing (OIDC, no stored token) needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Publish to npm
        env:
          # Only a fallback: without it npm authenticates with the OIDC token.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          # The tarballs the release carries, as packed (pnpm already rewrote
          # sout's workspace: specifier). core first: sout names it as a peer.
          for p in core sout; do npm publish packages/$p/*.tgz --access public --provenance; done
